{% extends 'base.html' %}
{% block title %}Entrar — LinguaQuest{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-card">
  <div class="auth-icon"><i class="bi bi-person-check"></i></div><h1>Bem-vindo de volta</h1><p>Continue sua sequência de aprendizado.</p>
  <form method="post" class="vstack gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div><label class="form-label" for="email">E-mail</label><input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required></div>
    <div><label class="form-label" for="password">Senha</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
  </form>
  <p class="auth-foot">Ainda não participa? <a href="{{ url_for('auth.register') }}">Criar conta</a></p>
</div></section>
{% endblock %}
